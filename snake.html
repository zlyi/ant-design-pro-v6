<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #4ecca3;
            margin-bottom: 20px;
        }
        canvas {
            border: 3px solid #4ecca3;
            border-radius: 5px;
            background: #16213e;
        }
        .score {
            color: #fff;
            font-size: 24px;
            margin-top: 15px;
        }
        .info {
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇</h1>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="score">分数: <span id="score">0</span></div>
    <div class="info">使用方向键控制，按空格键重新开始</div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const gridCount = canvas.width / gridSize;

        let snake, food, direction, score, gameLoop, gameOver;

        function init() {
            snake = [{ x: 10, y: 10 }];
            direction = { x: 0, y: 0 };
            score = 0;
            gameOver = false;
            document.getElementById('score').textContent = score;
            spawnFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 150);
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * gridCount),
                y: Math.floor(Math.random() * gridCount)
            };
            // 确保食物不在蛇身上
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                    return;
                }
            }
        }

        function update() {
            if (gameOver) return;

            // 移动蛇头
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // 检查碰撞墙壁
            if (head.x < 0 || head.x >= gridCount || head.y < 0 || head.y >= gridCount) {
                endGame();
                return;
            }

            // 检查碰撞自己
            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // 清空画布
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画蛇
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#4ecca3' : '#3ba386';
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });

            // 画食物
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // 游戏结束提示
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '20px Arial';
                ctx.fillText('按空格键重新开始', canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameLoop);
            draw();
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                init();
                return;
            }

            if (gameOver) return;

            switch (e.key) {
                case 'ArrowUp':
                    if (direction.y !== 1) direction = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1) direction = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1) direction = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (direction.x !== -1) direction = { x: 1, y: 0 };
                    break;
            }
        });

        init();
        draw();
    </script>
</body>
</html>
