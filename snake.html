<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #1a1a2e; font-family: Arial, sans-serif; }
    h1 { color: #eee; margin-bottom: 10px; }
    #score { color: #0f0; font-size: 20px; margin-bottom: 10px; }
    canvas { background: #16213e; border: 3px solid #0f0; border-radius: 5px; }
    #info { color: #888; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div id="score">得分: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="info">方向键或 WASD 控制 | 空格键暂停/开始</div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 20, cols = canvas.width / grid, rows = canvas.height / grid;
    let snake, food, dir, nextDir, score, gameLoop, paused, gameOver;

    function init() {
      snake = [{ x: 10, y: 10 }];
      dir = nextDir = { x: 1, y: 0 };
      score = 0;
      paused = false;
      gameOver = false;
      spawnFood();
      updateScore();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 100);
    }

    function spawnFood() {
      do {
        food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function update() {
      if (paused || gameOver) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      
      // 碰撞检测：墙壁和自身
      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || 
          snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver = true;
        draw();
        return;
      }
      
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScore();
        spawnFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // 画蛇
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#0f0' : '#0a0';
        ctx.fillRect(s.x * grid + 1, s.y * grid + 1, grid - 2, grid - 2);
      });
      
      // 画食物
      ctx.fillStyle = '#f00';
      ctx.beginPath();
      ctx.arc(food.x * grid + grid / 2, food.y * grid + grid / 2, grid / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      
      // 游戏结束提示
      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '20px Arial';
        ctx.fillText('按空格键重新开始', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function updateScore() {
      document.getElementById('score').textContent = `得分: ${score}`;
    }

    document.addEventListener('keydown', e => {
      const keys = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
                     w: [0,-1], s: [0,1], a: [-1,0], d: [1,0], W: [0,-1], S: [0,1], A: [-1,0], D: [1,0] };
      if (keys[e.key] && !gameOver) {
        const [x, y] = keys[e.key];
        if (x !== -dir.x || y !== -dir.y) nextDir = { x, y }; // 防止反向
        e.preventDefault();
      }
      if (e.key === ' ') {
        if (gameOver) init();
        else paused = !paused;
        e.preventDefault();
      }
    });

    init();
  </script>
</body>
</html>
