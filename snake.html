<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>贪吃蛇</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1a1a2e; font-family: Arial, sans-serif; }
    canvas { background: #16213e; border: 3px solid #0f3460; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    #score { color: #e94560; font-size: 24px; margin-bottom: 15px; }
    #info { color: #eee; font-size: 14px; margin-top: 15px; }
  </style>
</head>
<body>
  <div id="score">得分: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="info">方向键或 WASD 控制 | 空格键暂停 | R 重新开始</div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 20, cols = canvas.width / grid, rows = canvas.height / grid;
    let snake, food, dir, nextDir, score, gameLoop, paused, gameOver;

    function init() {
      snake = [{ x: 10, y: 10 }];
      dir = nextDir = { x: 1, y: 0 };
      score = 0;
      paused = gameOver = false;
      placeFood();
      updateScore();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 100);
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function updateScore() {
      document.getElementById('score').textContent = `得分: ${score}` + (gameOver ? ' - 游戏结束!' : paused ? ' - 暂停中' : '');
    }

    function update() {
      if (paused || gameOver) return;
      dir = nextDir;
      const head = { x: (snake[0].x + dir.x + cols) % cols, y: (snake[0].y + dir.y + rows) % rows };
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver = true;
        updateScore();
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // 绘制食物
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(food.x * grid + grid / 2, food.y * grid + grid / 2, grid / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      // 绘制蛇
      snake.forEach((seg, i) => {
        const brightness = Math.max(100, 255 - i * 10);
        ctx.fillStyle = `rgb(0, ${brightness}, 136)`;
        ctx.fillRect(seg.x * grid + 1, seg.y * grid + 1, grid - 2, grid - 2);
        if (i === 0) { // 蛇头眼睛
          ctx.fillStyle = '#fff';
          const eyeOffset = grid / 4;
          ctx.beginPath();
          ctx.arc(seg.x * grid + grid / 2 + dir.x * eyeOffset - dir.y * 4, seg.y * grid + grid / 2 + dir.y * eyeOffset - dir.x * 4, 2, 0, Math.PI * 2);
          ctx.arc(seg.x * grid + grid / 2 + dir.x * eyeOffset + dir.y * 4, seg.y * grid + grid / 2 + dir.y * eyeOffset + dir.x * 4, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    document.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      const dirs = {
        arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
        arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
        arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
        arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 }
      };
      if (dirs[key] && (dirs[key].x + dir.x !== 0 || dirs[key].y + dir.y !== 0)) {
        nextDir = dirs[key];
        e.preventDefault();
      }
      if (key === ' ') { paused = !paused; updateScore(); e.preventDefault(); }
      if (key === 'r') init();
    });

    init();
  </script>
</body>
</html>
